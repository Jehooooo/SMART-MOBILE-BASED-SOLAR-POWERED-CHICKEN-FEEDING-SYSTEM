name: iOS & Android Build Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.app / Payload)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS (No Codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Create Payload Directory & Package .ipa (Ad-Hoc / Sideloading)
        working-directory: app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r SmartFeeder-iOS-unsigned.ipa Payload
          zip -r SmartFeeder-Runner-app.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFeeder-iOS-unsigned
          path: app/SmartFeeder-iOS-unsigned.ipa

      - name: Upload Runner.app Archive
        uses: actions/upload-artifact@v4
        with:
          name: SmartFeeder-Runner-app
          path: app/SmartFeeder-Runner-app.zip

  build-android:
    name: Build Android Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Release APKs (Split per ABI)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
