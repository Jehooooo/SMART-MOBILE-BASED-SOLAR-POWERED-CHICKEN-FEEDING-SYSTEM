name: Build, Release & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-android:
    name: Build Android Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Release APKs (Split per ABI)
        working-directory: app
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_USER_EMAIL: ${{ secrets.FIREBASE_USER_EMAIL }}
          FIREBASE_USER_PASSWORD: ${{ secrets.FIREBASE_USER_PASSWORD }}
        run: |
          python3 -c 'import os, json; keys=["FIREBASE_API_KEY","FIREBASE_AUTH_DOMAIN","FIREBASE_DATABASE_URL","FIREBASE_PROJECT_ID","FIREBASE_STORAGE_BUCKET","FIREBASE_MESSAGING_SENDER_ID","FIREBASE_APP_ID","FIREBASE_MEASUREMENT_ID","FIREBASE_USER_EMAIL","FIREBASE_USER_PASSWORD"]; d={k:os.environ.get(k,"") for k in keys if os.environ.get(k)}; json.dump(d, open("ci_defines.json","w"))'
          flutter build apk --release --split-per-abi --dart-define-from-file=ci_defines.json
          rm -f ci_defines.json

      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  build-ios:
    name: Build iOS App (.ipa / Payload)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Flutter SwiftPM for CocoaPods Firebase Compatibility
        working-directory: app
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS (No Codesign)
        working-directory: app
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_USER_EMAIL: ${{ secrets.FIREBASE_USER_EMAIL }}
          FIREBASE_USER_PASSWORD: ${{ secrets.FIREBASE_USER_PASSWORD }}
        run: |
          python3 -c 'import os, json; keys=["FIREBASE_API_KEY","FIREBASE_AUTH_DOMAIN","FIREBASE_DATABASE_URL","FIREBASE_PROJECT_ID","FIREBASE_STORAGE_BUCKET","FIREBASE_MESSAGING_SENDER_ID","FIREBASE_APP_ID","FIREBASE_MEASUREMENT_ID","FIREBASE_USER_EMAIL","FIREBASE_USER_PASSWORD"]; d={k:os.environ.get(k,"") for k in keys if os.environ.get(k)}; json.dump(d, open("ci_defines.json","w"))'
          flutter build ios --release --no-codesign --dart-define-from-file=ci_defines.json
          rm -f ci_defines.json

      - name: Package .ipa and Runner.app
        working-directory: app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r SmartFeeder-iOS-unsigned.ipa Payload
          zip -r SmartFeeder-Runner-app.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFeeder-iOS-unsigned
          path: app/SmartFeeder-iOS-unsigned.ipa

  publish-release:
    name: Publish GitHub Release with Direct APK Downloads
    runs-on: ubuntu-latest
    needs: [build-android]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: release-assets

      - name: Download armeabi APK
        uses: actions/download-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          name: "Smart Chicken Feeder v1.0.0 Release"
          body: |
            ## 🐔 Smart Mobile-Based Solar-Powered Chicken Feeding System (v1.0.0)

            ### 📱 Android Direct Download
            - **[Download app-arm64-v8a-release.apk (Recommended)](https://github.com/Jehooooo/SMART-MOBILE-BASED-SOLAR-POWERED-CHICKEN-FEEDING-SYSTEM/releases/download/v1.0.0/app-arm64-v8a-release.apk)** (Optimized for 99% of modern Android devices: Samsung, Xiaomi, Oppo, Vivo, Realme, Pixel, etc.)
            - **[Download app-armeabi-v7a-release.apk](https://github.com/Jehooooo/SMART-MOBILE-BASED-SOLAR-POWERED-CHICKEN-FEEDING-SYSTEM/releases/download/v1.0.0/app-armeabi-v7a-release.apk)** (For older 32-bit devices)

            ### 🍎 iOS (iPhone / iPad) Installation
            Apple blocks downloading and running raw binaries from web links without enterprise profiles. Install the official PWA web app:
            1. Open **[Smart Feeder Web App](https://smart-chicken-feeder-33bec.web.app)** in Safari on your iPhone.
            2. Tap the **Share** button (box with upward arrow) $\rightarrow$ scroll down and select **"Add to Home Screen"**.
            3. Tap **Add**. The Smart Feeder app icon will appear on your home screen and run in standalone full-screen mode!
          files: |
            release-assets/app-arm64-v8a-release.apk
            release-assets/app-armeabi-v7a-release.apk
