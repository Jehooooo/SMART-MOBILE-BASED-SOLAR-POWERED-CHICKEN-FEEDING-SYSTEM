; Smart Mobile-Based Solar-Powered Chicken Feeding System
; ESP32 firmware - PlatformIO project configuration
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5          ; servo motor (dispenser gate)
    bogde/HX711 @ ^0.7.5                       ; load cell amplifier
    adafruit/RTClib @ ^2.1.4                   ; DS3231 real-time clock
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14
    bblanchon/ArduinoJson @ ^7.2.0
